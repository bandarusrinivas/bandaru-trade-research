# Bandaru Trade Research — MERN + Docker
#
# Usage:
#   docker compose up        # foreground (Ctrl+C to stop)
#   docker compose up -d     # background
#   docker compose down      # stop + remove containers
#
# Open http://localhost:3000 in any browser. Works on macOS, Windows, Linux.
#
# All services are open source:
#   - mongo:    MongoDB Community 7 (SSPL)
#   - server:   Node.js 20 LTS + Express + Mongoose (MIT)
#   - client:   React 18 + Vite + nginx (MIT / BSD)

services:

  # ---------- MongoDB ----------
  mongo:
    image: mongo:7
    container_name: bandaru-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: bandaru
    volumes:
      - mongo-data:/data/db
    networks:
      - bandaru-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Schwab data sidecar (Python Flask) ----------
  # Only starts under `--profile schwab` so default `docker compose up` skips it.
  # OAuth is done once on the host (auth-schwab.command); the token file is
  # mounted into this container so schwab-py can read + refresh it in place.
  #
  #   With Schwab:   docker compose --profile schwab up -d --build
  #   Yahoo only:    docker compose up -d --build
  schwab:
    build: ../legacy-python
    container_name: bandaru-schwab
    restart: unless-stopped
    profiles: ["schwab"]
    environment:
      # Fallbacks if env isn't injected; data_api.py also reads /app/.env directly
      SCHWAB_API_KEY: ${SCHWAB_API_KEY:-}
      SCHWAB_APP_SECRET: ${SCHWAB_APP_SECRET:-}
      SCHWAB_CALLBACK_URL: ${SCHWAB_CALLBACK_URL:-https://127.0.0.1}
      SCHWAB_TOKEN_PATH: /tokens/schwab_token.json
      PORT: 5050
    volumes:
      # Token file (read/write so schwab-py can refresh in place)
      - ../legacy-python:/tokens
      # Credentials — mount the project-root .env directly into the container
      # so load_dotenv() picks it up even when compose is run without --env-file.
      - ../.env:/app/.env:ro
    networks:
      - bandaru-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5050/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------- Express backend ----------
  server:
    build: ./server
    container_name: bandaru-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/bandaru
      # Data source — yahoo (default, free) | schwab (real-time, uses sidecar)
      DATA_SOURCE: ${DATA_SOURCE:-yahoo}
      # When DATA_SOURCE=schwab, the server proxies to this sidecar URL
      SCHWAB_SIDECAR_URL: http://schwab:5050
      # If Schwab call fails (token bad, sidecar down), auto-fallback to Yahoo
      SCHWAB_FALLBACK_TO_YAHOO: ${SCHWAB_FALLBACK_TO_YAHOO:-true}
      # Optional cache tuning (defaults in services/yahoo.js, services/schwab.js)
      YAHOO_CACHE_QUOTE_MS: ${YAHOO_CACHE_QUOTE_MS:-5000}
      YAHOO_CACHE_INTRADAY_MS: ${YAHOO_CACHE_INTRADAY_MS:-15000}
      # Optional Finnhub key — adds Finnhub headlines to the News Stock Feed.
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    ports:
      - "4000:4000"
    networks:
      - bandaru-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4000/api/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------- React frontend (served via nginx) ----------
  client:
    build:
      context: ./client
      args:
        VITE_API_BASE: /api    # nginx proxies /api → server
    container_name: bandaru-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"
    networks:
      - bandaru-net

volumes:
  mongo-data:

networks:
  bandaru-net:
    driver: bridge
