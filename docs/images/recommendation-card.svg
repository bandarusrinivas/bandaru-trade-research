<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="-apple-system, sans-serif">
  <rect width="800" height="380" fill="#0d1117"/>

  <!-- Card -->
  <rect x="20" y="20" width="760" height="340" fill="#161b22" stroke="#26d96e" stroke-width="2" rx="8"/>

  <!-- Status badge -->
  <rect x="40" y="40" width="90" height="32" fill="#26d96e" rx="4"/>
  <text x="58" y="61" fill="#0d1117" font-size="13" font-weight="bold">GO LONG</text>

  <!-- Direction -->
  <rect x="140" y="40" width="80" height="32" fill="rgba(38,217,110,0.18)" stroke="#26d96e" rx="4"/>
  <text x="158" y="61" fill="#26d96e" font-size="12" font-weight="bold">CALL</text>

  <!-- Strategy title -->
  <text x="240" y="62" fill="#e6edf3" font-size="16" font-weight="bold">Long CALL — Break above R1 (745.66)</text>

  <!-- Body -->
  <text x="40" y="105" fill="#97a1ab" font-size="11" font-weight="600">CONTRACT</text>
  <text x="40" y="125" fill="#e6edf3" font-size="14" font-weight="bold">SPY 250514C00745000</text>
  <text x="40" y="142" fill="#97a1ab" font-size="11">Strike 745 · Mid $1.85 · Bid×Ask $1.80×$1.90 · Δ 0.55</text>

  <text x="40" y="180" fill="#97a1ab" font-size="11" font-weight="600">ENTRY TRIGGER</text>
  <text x="40" y="200" fill="#e6edf3" font-size="13">SPY closes a 5-min candle above $745.66</text>

  <text x="40" y="230" fill="#97a1ab" font-size="11" font-weight="600">TARGETS</text>
  <text x="40" y="250" fill="#26d96e" font-size="13" font-weight="bold">▲ Profit:  SPY $749.00  →  Premium $3.69</text>
  <text x="40" y="270" fill="#ff7a8c" font-size="13" font-weight="bold">▼ Stop:    SPY $745.36  →  Premium $0.92  (50%)</text>

  <text x="40" y="300" fill="#97a1ab" font-size="11" font-weight="600">REASONING</text>
  <text x="40" y="320" fill="#e6edf3" font-size="13">Resistance at R1 (745.66). Break targets R2 749.00.</text>

  <!-- CALLOUTS -->
  <g stroke="#f1c870" stroke-width="1.5" fill="none">
    <path d="M 85 80 L 85 92 L 530 92"/>
    <circle cx="530" cy="92" r="3" fill="#f1c870"/>
    <path d="M 180 80 L 180 92"/>
    <path d="M 240 80 L 240 92"/>
    <circle cx="240" cy="92" r="3" fill="#f1c870"/>
  </g>
  <g font-size="11" fill="#f1c870" font-weight="bold">
    <text x="540" y="96">① Status: GO / READY / STANDBY / INVALID</text>
    <text x="250" y="96" font-size="10">② Type (CALL/PUT) + Strategy title</text>
  </g>
</svg>
